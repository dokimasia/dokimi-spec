# The settings of dokimi-spec, which ergon init merges into .golangci.yml.

formatters:
  settings:
    # The tooling module of the definition forms an import group of its own.
    gci:
      sections: [standard, default, "prefix(github.com/dokimasia/dokimi-spec)"]
