# The settings of dokimi-spec, which ergon init merges into .golangci.yml.

formatters:
  settings:
    # The module go.dokimi.dev/spec forms an import group of its own.
    gci:
      sections: [standard, default, "prefix(go.dokimi.dev/spec)"]
