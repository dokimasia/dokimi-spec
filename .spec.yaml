# The runtime contract of the conformance spec of dokimi, which each language repository vendors
# with spec. spec manifest writes spec/manifest.json.
definition:
  repo: dokimasia/dokimi-spec
  root: spec
  manifest: manifest.json
  languages: [go, typescript]
  files: [VERSION, "*.json", "schemas/*.json"]
  implementations:
    - {repo: dokimasia/dokimi-go, languages: [go]}
