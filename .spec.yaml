# The conformance spec of dokimi, which a runtime in another language than Go vendors with spec.
# The Go module go.dokimi.dev/spec in spec embeds the same files. spec manifest writes
# spec/manifest.json.
definition:
  repo: dokimasia/dokimi-spec
  root: spec
  manifest: manifest.json
  languages: [go, typescript]
  files: [VERSION, "*.json", "schemas/*.json"]
